name: Test

# Runs the detector test suite (scripts/*.test.ts) on this repo's own PRs.
# The tests are plain node:test files run via Node's native type stripping —
# no install or build step, matching how the reusable workflows execute the
# scripts.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Detector tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Run tests
        run: npm test
